<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remit dApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      @keyframes slide-in-right {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes slide-out-left {
          from { transform: translateX(0); }
          to { transform: translateX(-100%); }
      }
      @keyframes slide-in-left {
          from { transform: translateX(-100%); }
          to { transform: translateX(0); }
      }
      @keyframes slide-out-right {
          from { transform: translateX(0); }
          to { transform: translateX(100%); }
      }
      @keyframes slide-in-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      @keyframes slide-out-down {
        from { transform: translateY(0); }
        to { transform: translateY(100%); }
      }
      @keyframes scale-down-fade-out {
        from { transform: scale(1); opacity: 1; }
        to { transform: scale(0.95); opacity: 0; }
      }
      @keyframes scale-up-fade-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 0; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(3000deg); }
      }

      .animate-slide-in-right {
          animation: slide-in-right 0.5s ease-out forwards;
      }
      .animate-slide-out-left {
          animation: slide-out-left 0.5s ease-out forwards;
      }
      .animate-slide-in-left {
          animation: slide-in-left 0.5s ease-out forwards;
      }
      .animate-slide-out-right {
          animation: slide-out-right 0.5s ease-out forwards;
      }
      .animate-slide-in-up {
        animation: slide-in-up 0.5s ease-in-out forwards;
      }
      .animate-slide-out-down {
        animation: slide-out-down 0.5s ease-in-out forwards;
      }
      .animate-scale-down-fade-out {
        animation: scale-down-fade-out 0.5s ease-in-out forwards;
      }
      .animate-scale-up-fade-in {
        animation: scale-up-fade-in 0.5s ease-in-out forwards;
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
  }
}
</script>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
